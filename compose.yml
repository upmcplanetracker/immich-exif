# example compose file

services:
  immich-exif:
    container_name: immich-exif
    hostname: immich-exif
    image: ghcr.io/upmcplanetracker/immich-exif:latest
    restart: on-failure

    user: "1000:1000"

    environment:
      TZ: America/New_York
      SYNC_INTERVAL: "21600"
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEYS: "secret api key here, consider using docker secrets"
      EXIF_DRY_RUN: "1"
      EXIF_KEEP_BACKUPS: "1"
      LOG_FILE: /app/logs/exif-writer.log
      LOG_LEVEL: "info"
      STATE_FILE: /app/state/sync_state.json
      LOG_TO_FILE: "1"
      ENCODE_FACES: "0"   # note -- feature not enabled yet
      DB_USERNAME: "postgres"
      DB_PASSWORD: "consider using docker secrets"
      DB_HOSTNAME: "immich-postgres" # change as needed
      DB_DATABASE_NAME: "immich" # change as needed
      DB_PORT: "5432"
      
    volumes:
      - ${HOME}/immich-exif/logs:/app/logs   # must mount if you have LOG_TO_FILE: "1"
      - ${HOME}/Pictures:/usr/src/app/upload:rw
      - /mnt/other-external-libs:/usr/src/app/external/other-external-libs:rw
      - ${HOME}/immich-exif/state:/app/state:rw

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
